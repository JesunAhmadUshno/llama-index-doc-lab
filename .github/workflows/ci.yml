name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # CI needs only the test surface: pytest plus llama-index-core
        # (the LlamaIndex test uses a MockEmbedding). The full study
        # runtime pins live in requirements.txt.
        run: python -m pip install pytest llama-index-core==0.14.25
      - name: Run tests
        run: python -m pytest -q
      - name: Compile all study code
        run: python -m py_compile src/*.py src/prodref/*.py scripts/*.py
      - name: Results regenerate unchanged from the evidence
        run: python scripts/make_results.py && git diff --exit-code RESULTS.md results/
